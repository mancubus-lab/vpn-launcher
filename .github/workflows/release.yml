name: Release

# Pushing a tag like v1.2.3 builds the Windows installer and the macOS disk image and publishes a
# GitHub release with both. A manual run builds the same way but only keeps them as workflow artifacts.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build (nothing is published)"
        default: "0.0.0"

permissions:
  contents: write  # needed to create the release

env:
  # A tag v1.2.3 gives 1.2.3; a manual run uses the version typed in.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Importing the module runs its assertions; the smoke run brings the window up with two profiles.
      - name: Self-checks and smoke run
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/smoke_profiles.py
          python src/vpn_launcher.py --smoke

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart("v")
          ./build.ps1 -Version $version -Python (Get-Command python).Source
          $installer = "VpnLauncherSetup-$version.exe"
          if (-not (Test-Path "dist/$installer")) { throw "The installer was not built." }
          "$((Get-FileHash "dist/$installer" -Algorithm SHA256).Hash.ToLower())  $installer" |
            Set-Content "dist/$installer.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/VpnLauncherSetup-*.exe
            dist/VpnLauncherSetup-*.exe.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-latest  # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-mac.txt
          python -m pip freeze

      - name: Self-checks and smoke run
        timeout-minutes: 3
        run: |
          python tests/smoke_profiles.py
          python src/vpn_launcher.py --smoke

      - name: Build
        run: |
          version="${VERSION#v}"
          PYTHON=python bash build_mac.sh "$version"
          cd dist
          for image in VpnLauncher-*.dmg; do shasum -a 256 "$image" > "$image.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/VpnLauncher-*.dmg
            dist/VpnLauncher-*.dmg.sha256
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" files/*
          --repo "$GITHUB_REPOSITORY"
          --title "VPN Launcher ${GITHUB_REF_NAME#v}" --generate-notes
